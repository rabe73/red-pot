<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{lang}}">
<link rel="icon" href="{{root}}assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="{{root}}assets/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="{{root}}assets/apple-touch-icon.png">
<meta name="theme-color" content="#fdfaf4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)">
<meta property="og:image" content="{{baseUrl}}/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="{{root}}style.css">
</head>
<body>
<a class="skip" href="#main">{{skip}}</a>
<header>
  <a class="brand" href="{{root}}{{lang}}/"><img src="{{root}}assets/logo-512.png" alt="" width="512" height="512">Red&nbsp;Pot</a>
  <nav aria-label="{{navLabel}}">{{nav}}</nav>
</header>
<main id="main">
{{content}}
</main>
<footer>
  <nav aria-label="{{langLabel}}" class="langs">{{langs}}</nav>
  <p class="fine">© {{year}} Red Pot</p>
</footer>
</body>
</html>
