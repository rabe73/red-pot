name: Build and publish

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Deploy needs these; the build job below runs with the default read-only token.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 build.py
      - name: Every built page must be well-formed
        # Cheap and worth it: a stray unclosed tag in a hand-written fragment
        # renders as a mess rather than as an error, and nobody notices until a
        # reviewer opens the privacy page. Python's own parser catches it here.
        run: python3 tools/checkhtml.py dist
      - name: No unresolved template placeholders
        run: |
          if grep -rn '{{[a-zA-Z]' dist; then
            echo "::error::a {{placeholder}} survived the build"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    # Only main publishes. Every branch is built and checked above, so a broken
    # page fails before it can reach the live privacy URL -- which is the one
    # URL an App Store reviewer will open.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
